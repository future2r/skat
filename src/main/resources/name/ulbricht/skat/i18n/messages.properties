# Rules ("Spielregeln", also opened by "Warum?")
rules.title=Spielregeln
rules.title.OVERVIEW=Worum geht es?
rules.title.CARDS=Karten und Augen
rules.title.TRUMP=Trumpf
rules.title.FOLLOW=Zugeben und Stechen
rules.title.BIDDING=Reizen
rules.title.SKAT=Skat und Drücken
rules.title.VALUE=Spielwert
rules.title.WINNING=Gewinnen
rules.text.OVERVIEW=Skat spielen drei: du, Ludwig und Richard. Es gibt 32 Karten. Jeder bekommt 10 Karten, \
    zwei Karten liegen verdeckt als Skat in der Mitte.\n\n\
    Beim Reizen wird ausgemacht, wer allein spielt. Dieser Alleinspieler spielt gegen die beiden anderen, \
    die dann zusammenhalten.\n\n\
    Alle Karten zusammen haben 120 Augen. Der Alleinspieler gewinnt, wenn er mindestens 61 Augen bekommt. \
    Der Skat zählt am Ende für ihn mit.
rules.text.CARDS=Jede Farbe – Eichel, Grün, Rot und Schellen – hat acht Karten. So viele Augen sind sie wert:\n\n\
    Ass 11 · Zehn 10 · König 4 · Ober 3 · Unter 2 · Neun, Acht und Sieben 0\n\n\
    In einer Farbe sticht die höhere Karte die niedrigere, in dieser Reihenfolge: \
    Ass, Zehn, König, Ober, Neun, Acht, Sieben. Die Unter gehören nicht dazu, sie sind Trumpf.
rules.text.TRUMP=Trumpf sticht jede andere Farbe.\n\n\
    Die vier Unter sind immer die höchsten Trümpfe: Eichel-Unter, Grün-Unter, Rot-Unter, Schellen-Unter.\n\n\
    Beim Farbspiel kommen die Karten der angesagten Farbe dazu, zum Beispiel beim Grün-Spiel alle grünen \
    Karten. Beim Grand sind nur die vier Unter Trumpf.\n\n\
    Beim Null gibt es keinen Trumpf. Die Unter sind dort normale Karten, und die Reihenfolge ist \
    Ass, König, Ober, Unter, Zehn, Neun, Acht, Sieben.
rules.text.FOLLOW=Wer ausspielt, darf jede Karte legen.\n\n\
    Die anderen müssen die ausgespielte Farbe zugeben, wenn sie können. Wird Trumpf ausgespielt, \
    muss Trumpf zugegeben werden. Ein Unter zählt dabei als Trumpf, nicht als seine Farbe.\n\n\
    Wer nicht zugeben kann, darf stechen (einen Trumpf legen) oder eine beliebige Karte abwerfen.\n\n\
    Den Stich bekommt der höchste Trumpf. Liegt kein Trumpf, bekommt ihn die höchste Karte der \
    ausgespielten Farbe. Wer den Stich bekommt, spielt als Nächstes aus.
rules.text.BIDDING=Gereizt wird mit Zahlen: 18, 20, 22, 23, 24, 27, 30 und so weiter.\n\n\
    Zuerst sagt Mittelhand der Vorhand Zahlen. Vorhand hält mit „Ja“ oder passt. Danach sagt Hinterhand \
    dem, der übrig geblieben ist, weiter. Wer zuletzt übrig bleibt, spielt allein.\n\n\
    Reize nur so hoch, wie dein Spiel wert ist. Die Reiz-Hilfe sagt dir, wie weit deine Karten etwa reichen.\n\n\
    Passen alle, werden die Karten neu gegeben.
rules.text.SKAT=Der Alleinspieler darf den Skat aufnehmen. Dann hat er 12 Karten und legt zwei beliebige \
    Karten wieder weg („drücken“). Ihre Augen zählen am Ende für ihn.\n\n\
    Er darf den Skat auch liegen lassen und „Hand“ spielen. Das ist schwerer, zählt aber eine Stufe mehr. \
    Die Augen im Skat bekommt er trotzdem.\n\n\
    Nur beim Handspiel darf man zusätzlich Schneider oder Schwarz ansagen.
rules.text.VALUE=Jedes Spiel hat einen Grundwert: Schellen 9, Rot 10, Grün 11, Eichel 12, Grand 24.\n\n\
    Er wird mit den Stufen malgenommen. Die erste Stufe sind die Spitzen: Wer den Eichel-Unter hat, spielt \
    „mit“ so vielen höchsten Trümpfen, wie er ohne Lücke hat. Sonst spielt er „ohne“ so viele, wie ihm \
    darüber fehlen. Dazu kommt 1 für das Spiel und je 1 für Hand, Schneider, Schneider angesagt, Schwarz, \
    Schwarz angesagt und ouvert.\n\n\
    Beispiel: mit 1, Spiel 2 × Grün 11 = 22.\n\n\
    Null hat feste Werte: Null 23, Null Hand 35, Null ouvert 46, Null ouvert Hand 59.\n\n\
    Ist das Spiel weniger wert als gereizt wurde, ist es überreizt und verloren.
rules.text.WINNING=Der Alleinspieler gewinnt mit mindestens 61 Augen, der Skat zählt mit.\n\n\
    Schneider ist, wer höchstens 30 Augen hat. Schwarz ist, wer keinen einzigen Stich bekommt. \
    Beides macht das Spiel mehr wert.\n\n\
    Hat der Alleinspieler Schneider oder Schwarz angesagt, muss er das auch erreichen. \
    Bei Grand ouvert oder einem Farbspiel ouvert liegen seine Karten offen, und er muss alle Stiche bekommen.\n\n\
    Beim Null darf der Alleinspieler keinen einzigen Stich bekommen. Bekommt er doch einen, ist das Spiel \
    sofort vorbei und verloren. Bei Null ouvert liegen seine Karten dabei offen auf dem Tisch.

